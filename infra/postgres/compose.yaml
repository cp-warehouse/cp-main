name: cp-main-local

services:
  db:
    image: postgres:18-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: company_analysis
      POSTGRES_USER: company_dev
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in infra/postgres/.env}
    ports:
      - "127.0.0.1:${DB_PORT:-55432}:5432"
    volumes:
      - db_data:/var/lib/postgresql
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U company_dev -d company_analysis"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    stop_grace_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  db_data:
    external: true
    name: ${DB_VOLUME_NAME:-cp-main-pg18-data}
